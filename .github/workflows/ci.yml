name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # Integration tests hit a real local Supabase/Postgres instance rather
      # than mocking it — this is exactly what caught several RLS policies
      # that looked correct in the migration source but were either missing
      # an explicit WITH CHECK or had RLS never actually enabled on the
      # table at all (see migrations 031, 033, 034, 035). A mocked unit test
      # can't catch that class of bug; only a real database can.
      - run: npx supabase start
      - run: npx supabase db reset
      - run: ./scripts/local-db-grants.sh
      - run: npm run test:integration
      # Catches vulnerable pinned dependencies automatically (this is exactly
      # how the Next.js 15.0.5 / CVE-2025-29927 issue slipped through —
      # nothing before this ran an audit). Gates on high/critical only, since
      # lower-severity findings are common in transitive deps and too noisy
      # to hard-fail every build on.
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
